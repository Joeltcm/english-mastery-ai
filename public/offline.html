<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#28243e" />
    <title>English Mastery — Offline</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f6f7fb; color: #28243e; }
      body { display: grid; min-height: 100vh; place-items: center; margin: 0; padding: 24px; box-sizing: border-box; }
      main { max-width: 420px; padding: 32px; border: 1px solid #e1e2eb; border-radius: 20px; background: white; box-shadow: 0 16px 40px #28243e12; }
      h1 { margin: 0 0 12px; font-size: 28px; letter-spacing: -.04em; }
      p { margin: 0; color: #686a7d; line-height: 1.6; }
      .mark { display: grid; width: 42px; height: 42px; margin-bottom: 20px; place-items: center; border-radius: 13px; color: white; background: #6652c5; font-weight: 800; }
    </style>
  </head>
  <body><main><div class="mark">EM</div><h1>You’re offline.</h1><p>English Mastery will reconnect automatically. Once you’re back online, your private learning space and practice history will be available again.</p></main></body>
</html>
